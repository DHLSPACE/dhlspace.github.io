name: Build and deploy 162383.xyz

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 1,13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for Sch Doc
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check and preserve graduate admissions sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B -m unittest discover -s scripts/sch_doc -p test_cloud.py
          python -B scripts/sch_doc/cloud.py --sync

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      - name: Preserve Date Invite during migration
        run: |
          if [ -d date-invite ]; then
            cp -R date-invite dist/date-invite
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
