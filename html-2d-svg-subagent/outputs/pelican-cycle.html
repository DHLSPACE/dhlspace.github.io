<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f1e5">
  <title>鹈鹕的海边骑行 · Pelican Coast Club</title>
  <style>
    :root { color-scheme: light; --ink: #264b48; --paper: #f7f1e5; --duration: 1.6s; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .page { max-width: 1600px; min-height: 100svh; margin: auto; padding: 30px 5vw 20px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { font-size: 12px; font-weight: 700; letter-spacing: .15em; display: flex; align-items: center; gap: 12px; }
    .mark { width: 30px; height: 30px; border: 1px solid #264b48; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }
    .edition { font-size: 10px; letter-spacing: .16em; opacity: .65; }
    main { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; }
    .intro { position: absolute; z-index: 1; top: 8%; left: 1%; pointer-events: none; }
    .eyebrow { font-size: 10px; letter-spacing: .24em; margin-bottom: 16px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(42px, 6.2vw, 86px); letter-spacing: -.055em; line-height: .99; margin: 0; }
    h1 em { font-weight: 400; color: #c27749; }
    .subtitle { font-size: 13px; letter-spacing: .12em; margin-top: 22px; opacity: .7; }
    .scene { width: 100%; display: block; overflow: visible; max-height: 77vh; min-height: 400px; }
    footer { border-top: 1px solid #264b4826; padding-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .caption { font-size: 12px; line-height: 1.8; }
    .caption small { display: block; font-size: 9px; letter-spacing: .16em; opacity: .6; }
    .controls { display: flex; gap: 14px; align-items: center; }
    button { font: inherit; border: 1px solid #264b483d; background: transparent; color: var(--ink); border-radius: 50%; height: 42px; width: 42px; cursor: pointer; display: grid; place-items: center; }
    button:hover { background: #264b480b; }
    button:focus-visible, input:focus-visible { outline: 2px solid #c27749; outline-offset: 5px; }
    .speed { display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: .08em; }
    input { width: 86px; accent-color: #527b71; cursor: pointer; }
    output { min-width: 32px; font-variant-numeric: tabular-nums; }
    .cloud { animation: drift calc(var(--duration) * 28) linear infinite; }
    .cloud.slow { animation-duration: calc(var(--duration) * 43); }
    .landscape { animation: landscape calc(var(--duration) * 14) linear infinite; }
    .road { animation: road calc(var(--duration) * 1.4) linear infinite; }
    .wind { animation: wind calc(var(--duration) * 2) ease-in-out infinite; }
    .wind.second { animation-delay: -.7s; }
    .scarf-tip { transform-origin: 608px 290px; animation: flutter calc(var(--duration) * .65) ease-in-out infinite alternate; }
    .grass { transform-origin: bottom; }
    .paused *, .reduced * { animation-play-state: paused !important; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1300px); } }
    @keyframes landscape { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-240px); } }
    @keyframes wind { 0%,100% { opacity: 0; transform: translateX(15px); } 35%,70% { opacity: .65; } 90% { transform: translateX(-65px); } }
    @keyframes flutter { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }
    @media (max-width: 700px) {
      .page { padding: 22px 6vw; }
      .edition { display: none; }
      .intro { position: relative; margin-top: 45px; top: auto; }
      h1 { font-size: 58px; }
      .scene { width: 150%; margin-left: -26%; min-height: 300px; max-height: none; }
      main { overflow: hidden; }
      footer { align-items: flex-end; }
      .caption { font-size: 11px; }
      .speed label { display: none; }
      input { width: 60px; }
      .controls { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="page" id="page">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">≈</span> PELICAN COAST CLUB</div>
      <div class="edition">A LITTLE RIDE, A LITTLE JOY. &nbsp; / &nbsp; Nº 001</div>
    </header>
    <main>
      <div class="intro">
        <div class="eyebrow">THE SLOW LIFE SERIES</div>
        <h1>Life is better<br><em>on two wheels.</em></h1>
        <p class="subtitle">海风正好，慢慢骑。</p>
      </div>
      <svg class="scene" viewBox="0 0 1200 760" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕的海边骑行</title>
        <desc id="scene-desc">一只戴着绿色头盔、系着橙色围巾的白色鹈鹕，踩着薄荷绿色自行车，沿着海岸向前骑行。车轮与脚踏转动，云朵和路面向后移动。</desc>
        <defs>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5d4ca"/><stop offset="1" stop-color="#d9e3d5"/></linearGradient>
          <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7ad72"/><stop offset="1" stop-color="#f0c997"/></linearGradient>
          <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9b057"/><stop offset="1" stop-color="#d99143"/></linearGradient>
          <clipPath id="vista"><rect x="0" y="0" width="1200" height="760"/></clipPath>
          <g id="cloud" fill="#fffdf4"><path d="M0 15C6 4 19 2 29 8C32-10 59-13 71 3C91-2 105 5 107 16Z"/></g>
          <g id="spokes" stroke="#68877b" stroke-width="1.5" opacity=".58">
            <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51M-66.5-27.5L66.5 27.5M-27.5-66.5L27.5 66.5M-66.5 27.5L66.5-27.5M-27.5 66.5L27.5-66.5"/>
            <circle r="59" fill="none" stroke-width=".7"/>
          </g>
          <g id="shore-detail" fill="none" stroke-linecap="round">
            <path d="M60 458h75M255 477h110M530 449h56M805 478h112M1015 451h73" stroke="#f7f1e5" stroke-width="3" opacity=".6"/>
            <path d="M168 494h40M421 489h70M729 495h50M1115 486h36" stroke="#87aea1" stroke-width="2" opacity=".5"/>
          </g>

            <path d="M15 660h44M126 689h24M203 653h23"/>
          </g>
          <g id="plant" stroke="#859c78" stroke-width="2.8" stroke-linecap="round" fill="none">

          <circle cx="925" cy="252" r="124" fill="none" stroke="#e9bb86" opacity=".2"/>

          <g class="cloud" opacity=".85"><use href="#cloud" transform="translate(530 170) scale(.7)"/><use href="#cloud" transform="translate(1130 315) scale(.8)"/><use href="#cloud" transform="translate(1830 170) scale(.7)"/><use href="#cloud" transform="translate(2430 315) scale(.8)"/></g>
          <path d="M0 420Q170 415 320 425T650 421T980 420T1200 421V568H0Z" fill="url(#sea)"/>

          <g class="landscape"><use href="#shore-detail"/><use href="#shore-detail" x="1200"/></g>
          <path d="M0 525Q270 541 497 526T906 528T1200 529V760H0Z" fill="#eae1c8"/>
          <path d="M0 531Q270 547 497 532T906 534T1200 535" fill="none" stroke="#f9f4e8" stroke-width="5"/>
          <g class="landscape"><use href="#plant" x="120" y="570"/><use href="#plant" x="995" y="554"/><use href="#plant" x="1320" y="570"/><use href="#plant" x="2195" y="554"/></g>
          <path d="M0 619Q450 607 1200 619V726Q440 713 0 729Z" fill="#ded9c5"/>
          <path d="M0 619Q450 607 1200 619" stroke="#c3c0ab" fill="none" stroke-width="2"/>
          <g class="road"><use href="#road-detail"/><use href="#road-detail" x="240"/><use href="#road-detail" x="480"/><use href="#road-detail" x="720"/><use href="#road-detail" x="960"/><use href="#road-detail" x="1200"/></g>
          <ellipse cx="603" cy="648" rx="204" ry="12" fill="#7f8e7526"/>
          <g class="wind" stroke="#91aaa0" stroke-width="2" stroke-linecap="round"><path d="M373 340h58M349 356h26M385 372h36"/></g>
          <g class="wind second" stroke="#91aaa0" stroke-width="2" stroke-linecap="round"><path d="M838 483h39M861 496h23"/></g>
          <!-- Wheels have their own rotating spokes; the tire remains round. -->
          <g id="rear-wheel" transform="translate(459 570)">
            <circle r="77" fill="#f7f1e555" stroke="#294b47" stroke-width="9"/>
            <circle r="70.5" fill="none" stroke="#f7f1e5" stroke-width="2.5"/>
            <g id="rear-spokes"><use href="#spokes"/><path d="M-18-65h12" stroke="#e5b365" stroke-width="4" stroke-linecap="round"/></g>
            <circle r="7" fill="#33574f"/><circle r="2.5" fill="#e9e1c9"/>
          </g>
          <g id="front-wheel" transform="translate(745 570)">
            <circle r="77" fill="#f7f1e555" stroke="#294b47" stroke-width="9"/>
            <circle r="70.5" fill="none" stroke="#f7f1e5" stroke-width="2.5"/>
            <g id="front-spokes"><use href="#spokes"/><path d="M-18-65h12" stroke="#e5b365" stroke-width="4" stroke-linecap="round"/></g>
            <circle r="7" fill="#33574f"/><circle r="2.5" fill="#e9e1c9"/>
          </g>
          <!-- The far leg passes behind the bicycle frame. -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path id="far-leg" stroke="#be8a48" stroke-width="11"/>
            <path id="far-foot" stroke="#be8a48" stroke-width="9"/>
          </g>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M459 570L550 468L596 570ZM550 468H709L596 570M709 468L745 570" stroke="#355d53" stroke-width="11"/>
            <path d="M459 570L550 468L596 570ZM550 468H709L596 570M709 468L745 570" stroke="#75a99a" stroke-width="7"/>
            <path d="M550 468L542 442M709 468L695 422L708 404Q716 396 734 407" stroke="#355d53" stroke-width="8"/>
            <path d="M709 468L695 422L708 404Q716 396 734 407" stroke="#75a99a" stroke-width="4"/>
            <path d="M720 401L735 407" stroke="#b8784c" stroke-width="10"/>
            <path d="M733 411Q774 463 749 537" stroke="#3c5a50" stroke-width="1.5"/>
            <path d="M459 564L596 549Q620 552 618 570Q619 591 596 592L459 579Z" stroke="#33584d" stroke-width="2"/>
          </g>
          <path d="M520 434Q535 427 564 431Q575 435 565 442H524Q511 439 520 434Z" fill="#79543f"/>
          <path d="M524 433H558" stroke="#b88459" stroke-width="2" stroke-linecap="round"/>
          <circle cx="596" cy="570" r="23" fill="#d3dfcf" stroke="#41685c" stroke-width="3"/>
          <circle cx="596" cy="570" r="15" fill="none" stroke="#739185" stroke-width="1.5" stroke-dasharray="2 4"/>
          <g id="crank" transform="translate(596 570)"><path d="M-35 0H35" stroke="#49695e" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="#36564d"/></g>
          <g id="rider">
            <!-- Tail, plump body, and the folded wing. -->
            <path d="M509 373L459 347Q465 373 483 390L461 382Q478 406 508 407Z" fill="#e2e4d7" stroke="#5b7668" stroke-width="2" stroke-linejoin="round"/>
            <path d="M513 326Q546 304 584 320Q617 333 627 376Q625 417 582 433Q533 445 502 409Q477 380 492 346Q499 333 513 326Z" fill="#fffdf2" stroke="#4a685d" stroke-width="2.5"/>
            <path d="M504 388Q523 427 574 424Q603 420 619 400Q603 436 569 437Q525 435 504 409Z" fill="#e7e8da"/>
            <!-- The long neck curves forward into a recognizable pelican head. -->
            <path d="M575 332Q594 302 593 263Q589 224 615 202Q640 181 670 194Q694 207 686 235Q680 254 652 265Q635 274 639 308L650 360Q652 393 625 405L604 372Z" fill="#fffdf2" stroke="#4a685d" stroke-width="2.5"/>
            <path d="M625 272Q613 307 630 355Q640 380 624 393" fill="none" stroke="#e1e5d6" stroke-width="12" stroke-linecap="round"/>
            <!-- Lower pouch and a long, flat upper bill. -->
            <path d="M672 234L816 232Q787 269 739 275Q699 277 680 253Z" fill="#e7bc83" stroke="#886441" stroke-width="2"/>
            <path d="M682 243Q733 269 793 243" fill="none" stroke="#d69d66" stroke-width="2"/>
            <path d="M670 220Q731 218 815 228Q825 230 817 236L670 240Q659 231 670 220Z" fill="url(#bill)" stroke="#886441" stroke-width="2"/>
            <path d="M683 229L808 233" stroke="#f4d590" stroke-width="2" stroke-linecap="round"/>
            <path d="M815 229Q827 230 820 239" fill="none" stroke="#886441" stroke-width="2" stroke-linecap="round"/>
            <circle cx="659" cy="215" r="10" fill="#eadfc0"/>
            <circle cx="661" cy="215" r="4.5" fill="#29433d"/>
            <circle cx="662.5" cy="213.5" r="1.4" fill="white"/>
            <path d="M648 200Q655 197 662 200" fill="none" stroke="#4a685d" stroke-width="2" stroke-linecap="round"/>
            <!-- A little vintage helmet. -->
            <path d="M602 205Q599 172 625 160Q653 147 675 174L684 194Q649 188 608 210Z" fill="#648e7c" stroke="#35594d" stroke-width="2.5"/>
            <path d="M627 161Q615 181 622 201M646 158Q634 176 642 195" fill="none" stroke="#93b29a" stroke-width="6"/>
            <path d="M601 209Q641 187 684 194" fill="none" stroke="#35594d" stroke-width="5" stroke-linecap="round"/>
            <path d="M611 210L620 243L639 249" fill="none" stroke="#a0764f" stroke-width="3" stroke-linecap="round"/>
            <rect x="631" y="245" width="10" height="6" rx="2" fill="#35594d"/>
            <!-- Scarf tails flutter around a fixed knot. -->
            <g class="scarf-tip"><path d="M610 284Q574 270 539 288Q526 294 509 286L518 308Q546 315 569 296L608 298Z" fill="#ce7851" stroke="#a46043" stroke-width="1.5"/><path d="M603 292Q567 301 549 325L566 331Q576 312 611 303Z" fill="#dc9264"/><path d="M526 294L530 306M535 292L539 303" stroke="#f0bc87" stroke-width="3"/></g>
            <path d="M596 277Q618 287 639 276L642 291Q620 305 598 292Z" fill="#d88659" stroke="#a46043" stroke-width="1.5"/>
            <ellipse cx="605" cy="292" rx="9" ry="10" fill="#bf704b"/>
            <!-- Wing reaches the handlebar like a relaxed arm. -->
            <path d="M528 345Q551 326 579 344Q599 360 626 370L700 395Q714 398 722 406Q709 416 696 411L622 394Q588 398 565 390Q537 384 528 363Q523 353 528 345Z" fill="#f2f2e4" stroke="#4a685d" stroke-width="2.5"/>
            <path d="M542 357Q556 376 584 379L622 385M540 367Q554 384 579 387" fill="none" stroke="#c3cfbb" stroke-width="2" stroke-linecap="round"/>
            <path d="M696 400L712 406M692 405L705 410" stroke="#c3cfbb" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path id="near-leg" stroke="#d7a052" stroke-width="12"/>
            <path id="near-leg-highlight" stroke="#efbf74" stroke-width="3"/>
          </g>
          <path id="near-foot" fill="#d7a052" stroke="#936b3e" stroke-width="1.5" stroke-linejoin="round"/>
          <g stroke="#35564b" stroke-width="5" stroke-linecap="round"><path id="near-pedal"/><path id="far-pedal"/></g>
          <g transform="translate(916 682)" fill="#668777"><path d="M0 0Q8-15 18 0Q28-15 36 0" fill="none" stroke="#668777" stroke-width="1.5"/><text x="46" y="4" font-family="Georgia, serif" font-size="12" font-style="italic">somewhere by the sea</text></g>
        </g>
      </svg>
    </main>
    <footer>
      <div class="caption">不赶路，去感受路。<small>A SEASIDE LOOP · SVG IN MOTION</small></div>
      <div class="controls">
        <button id="toggle" type="button" aria-label="暂停动画" title="暂停动画"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path id="toggle-icon" d="M4 2V12M10 2V12" stroke="currentColor" stroke-width="2.5"/></svg></button>
        <div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="骑行速度"><output id="speed-value" for="speed">1×</output></div>
      </div>
    </footer>
  </div>
  <script>
    (() => {
      const byId = id => document.getElementById(id);
      const page = byId('page'), toggle = byId('toggle'), speedInput = byId('speed');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches, speed = 1, phase = .7, lastTime = null;
      const parts = Object.fromEntries(['rider', 'rear-spokes', 'front-spokes', 'crank', 'near-leg', 'near-leg-highlight', 'far-leg', 'near-foot', 'far-foot', 'near-pedal', 'far-pedal'].map(id => [id, byId(id)]));
      const point = (x, y) => `${x.toFixed(2)} ${y.toFixed(2)}`;

      function leg(angle, near, bob) {
        const hip = { x: near ? 575 : 565, y: 421 + bob };
        const foot = { x: 596 + Math.cos(angle) * 35, y: 570 + Math.sin(angle) * 35 };
        const dx = foot.x - hip.x, dy = foot.y - hip.y, distance = Math.hypot(dx, dy);
        // Two linked bones keep each ankle attached to its rotating pedal.
        const upper = 105, lower = 109;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * offset / distance, y: hip.y + dy * along / distance - dx * offset / distance };
        const path = `M${point(hip.x, hip.y)}L${point(knee.x, knee.y)}L${point(foot.x, foot.y - 5)}`;
        parts[near ? 'near-leg' : 'far-leg'].setAttribute('d', path);
        if (near) {
          parts['near-leg-highlight'].setAttribute('d', path);
          parts['near-foot'].setAttribute('d', `M${point(foot.x - 5, foot.y - 10)}Q${point(foot.x + 7, foot.y - 9)} ${point(foot.x + 20, foot.y - 4)}L${point(foot.x + 26, foot.y + 1)}L${point(foot.x - 11, foot.y + 1)}Z`);
        } else {
          parts['far-foot'].setAttribute('d', `M${point(foot.x - 9, foot.y - 3)}L${point(foot.x + 21, foot.y - 3)}`);
        }
        parts[near ? 'near-pedal' : 'far-pedal'].setAttribute('d', `M${point(foot.x - 12, foot.y + 4)}H${(foot.x + 13).toFixed(2)}`);
      }

      function draw() {
        const bob = Math.sin(phase * 2) * 1.7;
        const degrees = phase * 180 / Math.PI;
        parts.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
        parts['rear-spokes'].setAttribute('transform', `rotate(${degrees * 1.8})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${degrees * 1.8})`);
        parts.crank.setAttribute('transform', `translate(596 570) rotate(${degrees})`);
        leg(phase + Math.PI, false, bob);
        leg(phase, true, bob);
      }

      function syncControls() {
        page.classList.toggle('paused', !playing);
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        toggle.title = playing ? '暂停动画' : '播放动画';
        byId('toggle-icon').setAttribute('d', playing ? 'M4 2V12M10 2V12' : 'M4 2L11 7L4 12Z');
        byId('toggle-icon').setAttribute('fill', playing ? 'none' : 'currentColor');
      }

      let frameId = null;
      function frame(time) {
        if (lastTime !== null) phase = (phase + Math.min((time - lastTime) / 1000, .05) * speed * Math.PI * 2 / 1.6) % (Math.PI * 20);
        lastTime = time;
        draw();
        frameId = requestAnimationFrame(frame);
      }
      function schedule() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastTime = null;
        if (playing && !document.hidden) frameId = requestAnimationFrame(frame);
      }
      toggle.addEventListener('click', () => { playing = !playing; syncControls(); schedule(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed}×`;
        document.documentElement.style.setProperty('--duration', `${1.6 / speed}s`);
      });
      motionPreference.addEventListener('change', event => { playing = !event.matches; syncControls(); schedule(); });
      document.addEventListener('visibilitychange', schedule);
      draw();
      syncControls();
      schedule();
    })();
  </script>
</body>
</html>
